# TS frontend parameters settings
minWorkers: 0        # minimum number of workers of a model
maxWorkers: 2        # maximum number of workers of a model
batchSize: 7         # batch size of a model
maxBatchDelay: 100   # maximum delay of a batch (ms)
responseTimeout: 120 # timeout of a specific model's response (*in sec)
deviceType: "gpu"
# deviceIds: [0, 1]    # seting CUDA_VISIBLE_DEVICES

handler:
    mode: "text_generation"
    model_type: "bloom"
    tp_size: 0
    max_batch_size: 8
    max_input_len: 1024
    max_output_len: 128
